<script>
'use strict';
/* =====================================================================
   DailyWell — single-file app.
   CONFIGURATION: paste your Supabase project URL and PUBLISHABLE (anon) key.

const CFG = window.DAILYWELL_CONFIG || {};            // values live in config.js

let sb = null;

/* ---------- tiny helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

const sum = (a, f = x => x) => a.reduce((t, x) => t + (Number(f(x)) || 0), 0);

const cap = s => String(s || '').charAt(0).toUpperCase() + String(s || '').slice(1);

const fmtT = t => { t = T(t); if (!t) return ''; if (S.set.time_format === '24') return t; const [h, m] = t.split(':').map(Number); return `${h % 12 || 12}:${pad(m)} ${h < 12 ? 'AM' : 'PM'}`; };

const dateRange = (a, b) => { const o = []; for (let d = a; d <= b && o.length < 800; d = addDays(d, 1)) o.push(d); return o; };

const parseJSON = s => { try { return JSON.parse(s); } catch { return null; } };

/* ---------- state ---------- */
const DEF_SET = { units_weight: 'kg', units_length: 'cm', units_volume: 'ml', time_format: '12', theme: 'auto', calorie_target: 2200, protein_target: 120, carbs_target: 250, fat_target: 70, water_goal_ml: 2500, bed_time: '22:30', wake_time: '06:30', workouts_per_week_goal: 4, goal: 'maintain', diet: [], allergies: '', dislikes: '', quiet_start: null, quiet_end: null, wind_down_min: 30, water_reminder_hours: 0, browser_notifications: false, auto_reminders: true, height_cm: null, age: null, sex: null, activity: 'moderate', start_weight_kg: null, goal_weight_kg: null, onboarded: false };
const S = { user: null, profile: {}, set: { ...DEF_SET }, cache: {}, page: 'dashboard', date: today(), tab: {}, f: {}, started: false, charts: {}, after: [], banners: [], fired: new Set(), snooze: {}, rep: { from: addDays(today(), -29), to: today(), ex: '', meas: 'weight_kg' } };
const rows = t => S.cache[t] || [];
const TABLES = ['routine_items', 'routine_log', 'workouts', 'workout_exercises', 'custom_exercises', 'equipment', 'foods', 'meals', 'meal_plans', 'grocery_items', 'water_logs', 'sleep_logs', 'recovery_sessions', 'soreness_logs', 'supplements', 'supplement_logs', 'body_measurements', 'habits', 'habit_logs', 'daily_checkins', 'reminders'];
const CASCADE = { workouts: [['workout_exercises', 'workout_id']], routine_items: [['routine_log', 'item_id']], supplements: [['supplement_logs', 'supplement_id']], habits: [['habit_logs', 'habit_id']] };

/* ---------- units ---------- */
const CONV = {
  weight: { f: () => (S.set.units_weight === 'lb' ? 2.20462 : 1), u: () => (S.set.units_weight === 'lb' ? 'lb' : 'kg') },
  length: { f: () => (S.set.units_length === 'in' ? 1 / 2.54 : 1), u: () => (S.set.units_length === 'in' ? 'in' : 'cm') },
  volume: { f: () => (S.set.units_volume === 'oz' ? 1 / 29.5735 : 1), u: () => (S.set.units_volume === 'oz' ? 'oz' : 'ml') }

const toD = (c, v) => (v == null ? null : Number(v) * CONV[c].f());
const fromD = (c, v) => Math.round((v / CONV[c].f()) * 100) / 100;
const dispN = (c, v, d = 1) => (v == null ? '—' : `${num(toD(c, v), d)} ${CONV[c].u()}`);

/* ---------- errors, toasts ---------- */

  if (c === '23514' || c === '22003' || c === '22P02') return 'One of the values is outside the allowed range.';

  if (c === '42P01' || c === 'PGRST205') return 'The database is not set up yet. Run supabase_setup.sql in your Supabase project.';

function handleErr(e) {
  console.error('DailyWell error:', (e && (e.code || e.name)) || 'unknown');
  toast(friendly(e), 'err');
  if (isAuthErr(e) && CLOUD && S.user) sb.auth.signOut().catch(() => {});

const userErr = m => Object.assign(new Error(m), { user: true });

/* ---------- native (iOS / Android) helpers; every function is a safe no-op on the web ---------- */
const Native = {

  el.innerHTML = S.banners.map((b, i) => `<div class="banner" role="alert"><span aria-hidden="true">⏰</span><div class="grow"><strong>${esc(fmtT(b.time))}</strong> ${esc(b.title)}</div><button class="btn sm" data-act="rem-done" data-i="${i}">Done</button><button class="btn sm" data-act="rem-snooze" data-i="${i}">Snooze 10 min</button><button class="btn sm ghost" data-act="rem-dismiss" data-i="${i}" aria-label="Dismiss">✕</button></div>`).join('');
}

/* ---------- insights (only from real logged data) ---------- */
function insights() {
  const out = [], d = today(), last7 = dateRange(addDays(d, -6), d);
  const sl = last7.map(sleepMinOn).filter(m => m > 0);
  if (sl.length >= 3) { const a = avg(sl), t = sleepTargetMin(), diff = a - t; out.push(`You slept ${(a / 60).toFixed(1)} hours on average over ${sl.length} logged nights this week — ${Math.abs(diff) < 6 ? 'right on' : (Math.abs(diff) / 60).toFixed(1) + ' hours ' + (diff < 0 ? 'below' : 'above')} your ${(t / 60).toFixed(1)}-hour target.`); }
  const ws = weekStart(d), wk = rows('workouts').filter(w => w.workout_date >= ws && w.workout_date <= addDays(ws, 6) && w.status !== 'skipped');
  if (wk.length) out.push(`You completed ${wk.filter(w => w.status === 'done').length} of ${wk.length} scheduled workouts this week${S.set.workouts_per_week_goal ? ` (weekly goal: ${S.set.workouts_per_week_goal})` : ''}.`);
  if (rows('water_logs').some(w => w.log_date >= last7[0]) && S.set.water_goal_ml) out.push(`You reached your water goal on ${last7.filter(x => waterOn(x) >= S.set.water_goal_ml).length} of the last 7 days.`);
  const cd = last7.map(mealTotals).filter(m => m.nCal > 0);
  if (cd.length) out.push(`On the ${cd.length} day${cd.length > 1 ? 's' : ''} with logged calories this week you averaged ${num(avg(cd, m => m.cal))} kcal${S.set.calorie_target ? ` (target ${num(S.set.calorie_target)})` : ''}.`);
  const hb = rows('habits').filter(h => h.active);
  if (hb.length) { const tot = hb.length * 7, done = sum(hb, h => last7.filter(x => hasHabit(h.id, x)).length); out.push(`You completed ${done} of ${tot} possible habit check-ins in the last 7 days (${Math.round(done / tot * 100)}%).`); }
  const bw = rows('body_measurements').filter(m => m.weight_kg != null && m.measure_date >= addDays(d, -30)).sort((a, b) => a.measure_date.localeCompare(b.measure_date));
  if (bw.length >= 2) { const df = toD('weight', bw[bw.length - 1].weight_kg - bw[0].weight_kg); out.push(`Between ${fmtShort(bw[0].measure_date)} and ${fmtShort(bw[bw.length - 1].measure_date)} your recorded weight changed by ${df > 0 ? '+' : ''}${df.toFixed(1)} ${CONV.weight.u()}.`); }
  const ci = rows('daily_checkins').filter(c => c.checkin_date >= last7[0]);
  if (ci.length >= 3) { const m = avg(ci.filter(c => c.mood != null), c => c.mood), e = avg(ci.filter(c => c.energy != null), c => c.energy); out.push(`Your average mood this week is ${m ? m.toFixed(1) : '—'}/5 and energy ${e ? e.toFixed(1) : '—'}/5 across ${ci.length} check-ins.`); }
  if (S.set.calorie_target && S.set.calorie_target < calFloor()) out.push(`Your daily calorie target (${num(S.set.calorie_target)} kcal) is below commonly used minimums. Please talk to a doctor or registered dietitian before eating this little.`);
  return out;
}

/* ---------- small UI pieces ---------- */
const card = (title, body, cls = '') => `<section class="card ${cls}">${title ? `<h2>${title}</h2>` : ''}${body}</section>`;
const empty = (icon, msg, btn = '') => `<div class="empty"><div aria-hidden="true">${icon}</div><p>${msg}</p>${btn}</div>`;
const bar = (pct, cls = '') => `<div class="bar ${cls}" role="progressbar" aria-valuenow="${Math.round(clamp(pct, 0, 100))}" aria-valuemin="0" aria-valuemax="100"><span style="width:${clamp(pct, 0, 100)}%"></span></div>`;
const addBtn = (ent, label, preset, parent) => `<button class="btn primary" data-act="add" data-ent="${ent}"${preset ? ` data-preset='${esc(JSON.stringify(preset))}'` : ''}${parent ? ` data-parent='${esc(JSON.stringify(parent))}'` : ''}>＋ ${esc(label)}</button>`;
const rowBtns = (ent, id) => `<button class="btn sm ghost" data-act="edit" data-ent="${ent}" data-id="${id}">Edit</button><button class="btn sm ghost danger-t" data-act="del" data-ent="${ent}" data-id="${id}">Delete</button>`;
const dateNav = () => `<div class="datenav"><button class="btn sm" data-act="dprev" aria-label="Previous day">‹</button><input type="date" id="datePick" value="${S.date}" aria-label="Choose date"><button class="btn sm" data-act="dnext" aria-label="Next day">›</button><button class="btn sm ghost" data-act="dtoday">Today</button></div>`;
const tabsBar = (page, list) => { const cur = S.tab[page] || list[0][0]; return `<div class="tabs" role="group" aria-label="Sections">${list.map(([k, l]) => `<button class="btn sm" data-act="tab" data-tab="${k}" aria-pressed="${cur === k}">${l}</button>`).join('')}</div>`; };
const curTab = (page, def) => S.tab[page] || def;
const pct = (v, t) => (t > 0 ? (v / t) * 100 : 0);
const statCard = (k, v, s, b = '') => `<div class="card stat"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s || ''}</div>${b}</div>`;
const disclaimer = `<p class="small muted">${esc(DISCLAIMER)}</p>`;
const PAL = ['#0f6e7a', '#15803d', '#d97706', '#7c3aed', '#dc2626', '#0284c7', '#db2777'];
function mkChart(id, cfg) {
  const el = $('#' + id); if (!el) return;
  if (!window.Chart) { el.replaceWith(Object.assign(document.createElement('p'), { className: 'muted', textContent: 'Charts are unavailable because the chart library could not load.' })); return; }
  if (S.charts[id]) { try { S.charts[id].destroy(); } catch (e) { /* ignore */ } }
  Chart.defaults.color = cssv('--muted') || '#5a6b7b'; Chart.defaults.borderColor = cssv('--border') || '#dbe3ea';
  cfg.options = Object.assign({ responsive: true, maintainAspectRatio: false }, cfg.options || {});
  S.charts[id] = new Chart(el, cfg);
}
const chartBox = (id, label) => `<div class="chartbox"><canvas id="${id}" role="img" aria-label="${esc(label)}"></canvas></div>`;

/* ---------- pages ---------- */
const PAGES = {};

PAGES.dashboard = () => {

  const ls = rows('sleep_logs').filter(s => !s.is_nap).sort((a, b) => a.wake_at.localeCompare(b.wake_at)).pop(), nxt = nextReminder();
  const ins = insights().slice(0, 3);

  const quick = S.set.units_volume === 'oz' ? [[4, 118], [8, 237], [16, 473]] : [[150, 150], [250, 250], [500, 500]];
  S.after.push(() => {
    const days = dateRange(addDays(d, -6), d);
    mkChart('chWeek', { type: 'bar', data: { labels: days.map(fmtShort), datasets: [

      { label: 'Calories % of target', data: days.map(x => { const t = mealTotals(x); return S.set.calorie_target && t.nCal ? Math.round(t.cal / S.set.calorie_target * 100) : 0; }), backgroundColor: PAL[2] },
      { label: 'Sleep % of target', data: days.map(x => Math.round(sleepMinOn(x) / sleepTargetMin() * 100)), backgroundColor: PAL[3] }] }, options: { scales: { y: { beginAtZero: true, suggestedMax: 120 } } } });
    const w = rows('body_measurements').filter(x => x.weight_kg != null && x.measure_date >= addDays(d, -90)).sort((a, b) => a.measure_date.localeCompare(b.measure_date));
    if (w.length) mkChart('chWt', { type: 'line', data: { labels: w.map(x => fmtShort(x.measure_date)), datasets: [{ label: `Weight (${CONV.weight.u()})`, data: w.map(x => Math.round(toD('weight', x.weight_kg) * 10) / 10), borderColor: PAL[0], tension: .25 }] } });
  });

  return `<div class="top"><h1>Today · ${esc(fmtDate(d))}</h1><div class="btns"><button class="btn sm" data-act="water-add" data-ml="${quick[1][1]}">＋ ${quick[1][0]} ${CONV.volume.u()} water</button></div></div>
  ${rows('routine_items').length + rows('workouts').length + rows('meals').length === 0 ? `<div class="notice">Welcome! Start by setting up your <a href="#" data-act="nav" data-page="plan">daily plan</a>, or load <a href="#" data-act="sample-load">sample data</a> to explore (you can clear it any time in Settings).</div>` : ''}
  <div class="grid">
   <div class="card stat"><div class="k">Today's score</div><div class="ring" style="--p:${score || 0}"><div>${score == null ? '—' : score + '%'}</div></div><div class="s center">${score == null ? 'Nothing planned yet' : `${done} of ${cl.length} items done`}</div></div>
   ${statCard('Today\'s workout', `<span style="font-size:1.1rem">${wout}</span>`, `Week: ${rows('workouts').filter(w => w.status === 'done' && w.workout_date >= weekStart(d) && w.workout_date <= addDays(weekStart(d), 6)).length}/${S.set.workouts_per_week_goal || 0} done`)}
   ${statCard('Calories', m.nCal ? num(m.cal) + ' kcal' : (m.n ? 'not entered' : '0 kcal'), S.set.calorie_target ? `Target ${num(S.set.calorie_target)} kcal` : 'No target set', m.nCal && S.set.calorie_target ? bar(pct(m.cal, S.set.calorie_target), m.cal > S.set.calorie_target * 1.1 ? 'warn' : '') : '')}
   ${statCard('Water', dispN('volume', water, 0), gw ? `Goal ${dispN('volume', gw, 0)}` : '', gw ? bar(pct(water, gw), water >= gw ? 'ok' : '') : '')}
   ${statCard('Last sleep', ls ? fmtDur(sleepDur(ls)) : '—', ls ? `Woke ${fmtShort(ls.sleep_date)}${ls.quality ? ' · quality ' + ls.quality + '/5' : ''}` : 'No sleep logged yet')}
   ${statCard('Tonight / tomorrow', `Bed ${fmtT(S.set.bed_time)}`, `Wake up ${fmtT(S.set.wake_time)} · target ${(sleepTargetMin() / 60).toFixed(1)} h`)}
   ${statCard('Next reminder', nxt ? esc(fmtT(nxt.time)) : '—', nxt ? esc(nxt.title) : 'No more reminders today')}
  </div>
  <div class="grid two">
   ${card('Macros today', `${mac('Protein', m.p, S.set.protein_target, m.nP)}${bar(pct(m.p, S.set.protein_target))}${mac('Carbs', m.c, S.set.carbs_target, rows('meals').some(x => x.meal_date === d && x.carbs_g != null))}${bar(pct(m.c, S.set.carbs_target))}${mac('Fat', m.f, S.set.fat_target, rows('meals').some(x => x.meal_date === d && x.fat_g != null))}${bar(pct(m.f, S.set.fat_target))}`)}

  <div class="grid two">${card('Last 7 days vs. goals', chartBox('chWeek', 'Last 7 days: water, calories and sleep as a percent of goal'))}${card('Weight trend (90 days)', wRows.length ? chartBox('chWt', 'Weight over the last 90 days') : empty('📏', 'No weight entries yet.', `<button class="btn" data-act="nav" data-page="body">Add measurement</button>`))}</div>

PAGES.plan = () => {
  const d = S.date, D = dow(d), items = rows('routine_items').filter(i => i.active && (i.days || []).includes(D)).sort(cmpTime);
  const list = items.map(i => {
    const l = rows('routine_log').find(x => x.item_id === i.id && x.log_date === d), st = l && l.status;

  ${card(esc(fmtDate(d)), items.length ? `<ul class="clean">${list}</ul>` : empty('🗓️', 'No routine items for this day yet.', `<button class="btn primary" data-act="plan-tpl">Start from a template</button>`))}
  ${card('All routine items', all.length ? `<ul class="clean">${all.map(i => `<li class="row"><div class="t">${esc(fmtT(i.item_time))}</div><div class="grow"><strong>${esc(i.title)}</strong>${i.active ? '' : ' <span class="badge bad">paused</span>'}<div class="small muted">${(i.days || []).slice().sort().map(x => WD[x]).join(' · ')}</div></div><div class="btns">${rowBtns('routine_items', i.id)}</div></li>`).join('')}</ul>` : '<p class="muted">Nothing here yet.</p>')}`;
};

PAGES.workouts = () => {
  const f = S.f.workouts || (S.f.workouts = { q: '', status: '', loc: '', sort: 'desc' }), d = today();
  let list = rows('workouts').filter(w => (!f.q || (w.title + ' ' + (w.notes || '') + ' ' + (w.muscle_groups || []).join(' ') + ' ' + w.type).toLowerCase().includes(f.q.toLowerCase())) && (!f.status || w.status === f.status) && (!f.loc || w.location === f.loc));
  list.sort((a, b) => (f.sort === 'asc' ? 1 : -1) * (a.workout_date + T(a.start_time)).localeCompare(b.workout_date + T(b.start_time)));
  const ws = weekStart(d), wkDone = rows('workouts').filter(w => w.status === 'done' && w.workout_date >= ws && w.workout_date <= addDays(ws, 6)).length;
  const pr = {};
  rows('workout_exercises').forEach(x => { const w = rows('workouts').find(y => y.id === x.workout_id); if (!w || w.status !== 'done') return; const p = pr[x.exercise_name] || (pr[x.exercise_name] = { w: null, r: 0 }); if (x.weight_kg != null && (p.w == null || x.weight_kg > p.w)) p.w = x.weight_kg; if (x.reps > p.r) p.r = x.reps; });
  const prList = Object.entries(pr).sort((a, b) => (b[1].w || 0) - (a[1].w || 0)).slice(0, 10);
  const cards = list.map(w => {
    const ex = rows('workout_exercises').filter(x => x.workout_id === w.id);
    return `<article class="card item"><div class="ih"><div><h3>${esc(w.title)}</h3><div class="meta">${esc(fmtDate(w.workout_date))}${w.start_time ? ' · ' + esc(fmtT(w.start_time)) : ''}${w.duration_min ? ' · ' + w.duration_min + ' min' : ''} · ${esc(w.location)} · ${esc(w.type)}${w.effort ? ' · effort ' + w.effort + '/10' : ''}</div></div><span class="badge st-${w.status}">${w.status}</span></div>
    <div>${(w.muscle_groups || []).map(m => `<span class="tag">${esc(m)}</span>`).join('')}</div>
    ${ex.length ? `<ul class="exl">${ex.map(x => `<li><span>${esc(x.exercise_name)} — ${x.sets} × ${x.reps}${x.weight_kg != null ? ' @ ' + dispN('weight', x.weight_kg) : ''}${x.rest_sec ? ' · rest ' + x.rest_sec + 's' : ''}</span><span class="btns">${rowBtns('workout_exercises', x.id)}</span></li>`).join('')}</ul>` : '<p class="muted small">No exercises logged yet.</p>'}
    ${w.notes ? `<p class="note">${esc(w.notes)}</p>` : ''}
    <div class="btns">${w.status !== 'done' ? `<button class="btn sm primary" data-act="wk-status" data-id="${w.id}" data-st="done">Mark done</button>` : `<button class="btn sm" data-act="wk-status" data-id="${w.id}" data-st="planned">Undo done</button>`}${w.status === 'planned' ? `<button class="btn sm" data-act="wk-status" data-id="${w.id}" data-st="skipped">Skip</button>` : ''}${addBtn('workout_exercises', 'Exercise', null, { workout_id: w.id }).replace('btn primary', 'btn sm')}${rowBtns('workouts', w.id)}</div></article>`;
  }).join('');
  const custom = rows('custom_exercises');
  return `<div class="top"><h1>Workouts</h1><div class="btns">${addBtn('workouts', 'New workout')}<button class="btn" data-act="wk-tpl">Weekly plan template</button></div></div>
  <div class="grid">${statCard('This week', `${wkDone} / ${S.set.workouts_per_week_goal || 0}`, 'workouts completed vs. goal', bar(pct(wkDone, S.set.workouts_per_week_goal), wkDone >= S.set.workouts_per_week_goal ? 'ok' : ''))}${statCard('Total completed', rows('workouts').filter(w => w.status === 'done').length, 'all time')}</div>

  ${card('Exercise library', `<details><summary>Browse built-in exercises</summary>${Object.entries(EX_LIB).map(([g, l]) => `<p><strong>${cap(g)}:</strong> ${l.map(esc).join(', ')}</p>`).join('')}</details><h3 style="margin-top:.8rem">My custom exercises</h3>${custom.length ? `<ul class="clean">${custom.map(c => `<li class="row"><div class="grow"><strong>${esc(c.name)}</strong> <span class="badge">${esc(c.muscle_group)}</span></div><div class="btns">${rowBtns('custom_exercises', c.id)}</div></li>`).join('')}</ul>` : '<p class="muted small">None yet.</p>'}${addBtn('custom_exercises', 'Custom exercise')}`)}`;
};

PAGES.sleep = () => {
  const d = today(), logs = rows('sleep_logs').slice().sort((a, b) => b.wake_at.localeCompare(a.wake_at));
  const last14 = logs.filter(s => !s.is_nap && s.sleep_date >= addDays(d, -13)), last7 = logs.filter(s => !s.is_nap && s.sleep_date >= addDays(d, -6));
  const tgt = sleepTargetMin(), avg7 = last7.length ? avg(last7, sleepDur) : null, debt = last7.length ? sum(last7, sleepDur) - last7.length * tgt : null;
  let cons = null;
  if (last14.length >= 3) { const beds = last14.map(s => { let m = mins(hm(new Date(s.bed_at))); if (m < 720) m += 1440; return m; }), wakes = last14.map(s => mins(hm(new Date(s.wake_at)))); cons = Math.round(clamp(100 - (sd(beds) + sd(wakes)) / 2 * (100 / 90), 0, 100)); }
  S.after.push(() => {
    const days = dateRange(addDays(d, -13), d);
    mkChart('chSleep', { type: 'bar', data: { labels: days.map(fmtShort), datasets: [{ label: 'Hours slept', data: days.map(x => Math.round(sleepMinOn(x) / 6) / 10), backgroundColor: PAL[3] }, { type: 'line', label: 'Target', data: days.map(() => Math.round(tgt / 6) / 10), borderColor: PAL[1], pointRadius: 0 }] }, options: { scales: { y: { beginAtZero: true } } } });
  });
  return `<div class="top"><h1>Sleep</h1><div class="btns">${addBtn('sleep_logs', 'Log sleep')}<button class="btn" data-act="nav" data-page="settings">Change targets</button></div></div>
  <div class="grid">${statCard('Target', `${fmtT(S.set.bed_time)} → ${fmtT(S.set.wake_time)}`, `${(tgt / 60).toFixed(1)} hours`)}${statCard('7-day average', avg7 != null ? fmtDur(avg7) : '—', last7.length ? `${last7.length} night(s) logged` : 'No data yet')}${statCard('Sleep debt / surplus (7 days)', debt != null ? (debt >= 0 ? '+' : '−') + fmtDur(Math.abs(debt)) : '—', 'compared with your target')}${statCard('Consistency', cons != null ? cons + ' / 100' : '—', '100 = same bed and wake times every day (needs 3+ nights)')}</div>
  ${card('Last 14 days', chartBox('chSleep', 'Hours slept per night over the last 14 days'))}

  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function toCSV(t) {

  }
};

function authBody(tab) {

  return `<div class="tabs" role="group" aria-label="Account">${[['login', 'Log in'], ['signup', 'Sign up']].map(([k, l]) => `<button type="button" class="btn sm" data-act="auth-tab" data-tab="${k}" aria-pressed="${tab === k}">${l}</button>`).join('')}</div>

  ${r ? '' : `<div class="field"><label for="a_pw">Password${t ? ' (at least 8 characters)' : ''}</label><input id="a_pw" name="password" type="password" autocomplete="${t ? 'new-password' : 'current-password'}" required></div>`}
  ${t ? `<div class="field"><label for="a_pw2">Repeat password</label><input id="a_pw2" name="password2" type="password" autocomplete="new-password"></div><p class="small muted">${esc(DISCLAIMER)}</p>` : ''}
  ${tab === 'login' ? `<p><a href="#" data-act="auth-tab" data-tab="reset">Forgot your password?</a></p>` : ''}${r ? `<p class="small muted">Enter your email and we will send a reset link.</p>` : ''}`;
}
function authTab(form, tab) { form.dataset.tab = tab; form.querySelector('.mb').innerHTML = authBody(tab); form.querySelector('[type=submit]').textContent = { login: 'Log in', signup: 'Create account', reset: 'Send reset link' }[tab]; form.querySelector('.mh h2').textContent = { login: 'Log in', signup: 'Create your account', reset: 'Reset password' }[tab]; }
function openAuth(tab = 'login') {
  if (!CLOUD) { modal({ title: 'Local demo mode', body: `<p>The online account system is not configured yet, so DailyWell is running in <strong>local demo mode</strong>.</p><p>Your entries are saved only in this browser on this device — they are <strong>not</strong> synced or password-protected. To enable sign-up and log-in, follow the README to connect Supabase.</p>`, submit: 'Open local demo', onSubmit: () => { startLocal(); } }); return; }
  const m = modal({ title: tab === 'signup' ? 'Create your account' : 'Log in', body: authBody(tab), submit: tab === 'signup' ? 'Create account' : 'Log in', onSubmit: authSubmit });
  m.form.dataset.tab = tab;
}
async function authSubmit(form) {
  const tab = form.dataset.tab, email = form.elements.email.value.trim(), pw = form.elements.password ? form.elements.password.value : '';
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { setMsg(form, 'Please enter a valid email address.', false); return false; }
  const redirect = (NATIVE && WEB_URL) ? WEB_URL : location.origin + location.pathname;
  if (tab === 'reset') { await sb.auth.resetPasswordForEmail(email, { redirectTo: redirect }); setMsg(form, 'If that email has an account, a reset link is on its way. Check your inbox.', true); return false; }
  if (!pw) { setMsg(form, 'Please enter your password.', false); return false; }
  if (tab === 'signup') {
    if (pw.length < 8) { setMsg(form, 'Use at least 8 characters for your password.', false); return false; }
    if (pw !== form.elements.password2.value) { setMsg(form, 'The two passwords do not match.', false); return false; }
    const { data, error } = await sb.auth.signUp({ email, password: pw, options: { emailRedirectTo: redirect, data: { display_name: (form.elements.name.value || '').trim().slice(0, 80) } } });
    if (error) { setMsg(form, /rate|limit/i.test(error.message) ? 'Too many attempts. Please wait a few minutes and try again.' : 'We could not create that account. Check the details and try again.', false); return false; }

  }
  const { error } = await sb.auth.signInWithPassword({ email, password: pw });
  if (error) { setMsg(form, /rate|limit/i.test(error.message) ? 'Too many attempts. Please wait a few minutes and try again.' : 'Email or password is incorrect, or the email is not confirmed yet.', false); return false; }
  return true;
}

/* ---------- shell, render, startup ---------- */
function applyTheme() {
  const t = S.set.theme || 'auto', dark = t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  Native.theme(dark);
}
function shell() {
  $('#app').innerHTML = `<div class="shell"><aside class="side" aria-label="Main navigation"><div class="brand">${LOGO} DailyWell</div><nav class="nav" aria-label="Pages">${NAV.map(([k, l, i]) => `<a role="link" tabindex="0" data-act="nav" data-page="${k}" data-nav="${k}"><span aria-hidden="true">${i}</span> ${esc(l)}</a>`).join('')}</nav><div style="flex:1"></div><button class="btn sm" data-act="theme">◐ Light / dark</button></aside>
  <main id="main"><div id="banners" aria-live="assertive"></div>${CLOUD ? '' : '<div class="notice warn" role="status"><strong>Local demo mode:</strong> data stays only in this browser and is not protected by an account.</div>'}<div id="page"></div></main></div>
  <nav class="bottom" aria-label="Pages">${BOTTOM.map(k => { const n = NAV.find(x => x[0] === k); return `<a role="link" tabindex="0" data-act="nav" data-page="${k}" data-nav="${k}"><span aria-hidden="true">${n[2]}</span>${esc(n[1].replace("Today's ", ''))}</a>`; }).join('')}<a role="button" tabindex="0" data-act="more" data-nav="more"><span aria-hidden="true">☰</span>More</a></nav>`;

}
function render() {
  const el = $('#page'); if (!el) return;
  S.after = [];
  try { el.innerHTML = PAGES[S.page](); }
  catch (e) { console.error('DailyWell render error:', e && e.name); el.innerHTML = card('', empty('⚠️', 'Something went wrong showing this page.', '<button class="btn" data-act="nav" data-page="dashboard">Back to dashboard</button>')); }
  document.querySelectorAll('[data-nav]').forEach(a => { if (a.dataset.nav === S.page) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  S.after.forEach(f => { try { f(); } catch (e) { console.error('DailyWell chart error:', e && e.name); } });
  tmDraw();
}
function onboarding() {
  const fs = [{ k: 'goal', l: 'What is your main goal?', t: 'select', req: true, opts: [{ v: 'lose', l: 'Gradual fat loss' }, { v: 'maintain', l: 'Maintain' }, { v: 'gain', l: 'Gradual muscle gain' }, { v: 'energy', l: 'Energy / general health' }] }, { k: 'units_weight', l: 'Weight units', t: 'select', req: true, opts: [{ v: 'kg', l: 'Kilograms' }, { v: 'lb', l: 'Pounds' }] }, { k: 'bed_time', l: 'Usual bedtime', t: 'time', req: true }, { k: 'wake_time', l: 'Usual wake-up time', t: 'time', req: true }, { k: 'workouts_per_week_goal', l: 'Workouts per week', t: 'number', req: true, min: 0, max: 14, int: true }, { k: 'calorie_target', l: 'Daily calories (optional — you can use the calculator later)', t: 'number', min: 0, max: 10000, int: true }];
  let saved = false;
  modal({ title: 'Welcome to DailyWell 👋', submit: 'Save and start', cancel: 'Skip for now', wide: true, body: `<p class="muted">A few quick questions to set things up. You can change everything later in Settings.</p>${fs.map(f => fld(f, f.k === 'bed_time' || f.k === 'wake_time' ? T(S.set[f.k]) : S.set[f.k])).join('')}<div class="field chk"><label><input type="checkbox" name="sample"> Also add sample data so I can explore (removable in Settings)</label></div>`,
    onSubmit: async form => { const { out, errs } = readForm(form, fs); showErrs(form, errs); if (Object.keys(errs).length) return false; out.onboarded = true; if (out.calorie_target == null) delete out.calorie_target; await saveSettings(out); saved = true; if (form.elements.sample.checked) await loadSample(); applyTheme(); render(); },
    onClose: () => { if (!saved) saveSettings({ onboarded: true }).catch(() => {}); } });
}
async function startApp() {
  $('#app').innerHTML = '<div class="loading">Loading your data…</div>';
  try { await loadSettings(); await DB.loadAll(); }
  catch (e) { console.error('DailyWell load error:', (e && (e.code || e.name)) || 'unknown'); $('#app').innerHTML = `<div class="land"><div class="card"><h2>We could not load your data</h2><p>${esc(friendly(e))}</p><div class="btns"><button class="btn primary" onclick="location.reload()">Try again</button><button class="btn" data-act="logout">Log out</button></div></div></div>`; return; }
  S.started = true; S.date = today(); S.page = 'dashboard'; S.fired = new Set(); applyTheme(); shell(); render(); startEngine(); Native.schedule();
  if (!S.set.onboarded) onboarding();
}
function setupManifest() {
  try {
    const icon = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0f6e7a"/><path d="M8 34h13l6-14 10 28 7-14h12" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>');
    const mf = { name: 'DailyWell', short_name: 'DailyWell', start_url: location.origin + location.pathname, display: 'standalone', background_color: '#ffffff', theme_color: '#0f6e7a', icons: [{ src: icon, sizes: 'any', type: 'image/svg+xml' }] };
    const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(mf)); document.head.appendChild(l);
  } catch (e) { /* optional */ }
}
function init() {
  Native.init(); applyTheme(); setupManifest();
  window.addEventListener('offline', () => toast('You are offline. Changes cannot be saved until you reconnect.', 'err'));
  window.addEventListener('online', () => toast('Back online.', 'ok'));
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { applyTheme(); }); } catch (e) { /* old browser */ } }
  if (!CLOUD) { showLanding(); return; }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { flowType: 'pkce', persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  sb.auth.onAuthStateChange((ev, session) => {
    setTimeout(async () => {
      if (ev === 'PASSWORD_RECOVERY') { S.recovery = true; if (session) S.user = session.user; openNewPassword(); }
      else if (ev === 'SIGNED_OUT') { S.user = null; S.cache = {}; showLanding(); }

    }, 0);
  });
}
init();
